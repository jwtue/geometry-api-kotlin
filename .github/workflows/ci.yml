name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # jvmTest runs GeoMathTest and PolyBoolGeometryEngineTest (commonTest) on
      # the JVM; wasmJs is compile-checked rather than test-run in CI to avoid
      # depending on a headless-browser setup for coverage jvmTest already provides.
      - run: ./gradlew jvmTest compileKotlinWasmJs --console=plain
