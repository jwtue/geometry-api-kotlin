name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # jvmTest/jsNodeTest actually run GeoMathTest + PolyBoolGeometryEngineTest
      # (commonTest) - both were verified locally to genuinely execute (not just
      # compile) on jvm/js/mingwX64. jsNodeTest needs no browser, unlike
      # jsBrowserTest/wasmJs, which stay compile-checked here to avoid a
      # headless-browser CI dependency. Every other target (native) is
      # compile-checked only - ubuntu-latest can't execute mingwX64/macOS/iOS
      # test binaries.
      - run: >
          ./gradlew jvmTest jsNodeTest compileKotlinWasmJs compileKotlinJs
          compileKotlinLinuxX64 compileKotlinLinuxArm64 compileKotlinMingwX64
          compileKotlinMacosX64 compileKotlinMacosArm64 compileKotlinIosX64
          compileKotlinIosArm64 compileKotlinIosSimulatorArm64
          --console=plain
